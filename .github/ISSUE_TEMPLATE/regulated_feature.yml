name: Regulated feature (V&V)
description: A user requirement / feature for a GxP-regulated build. Captures the risk linkage, URS, and feature tests for full ICH E6 (R3) traceability.
title: "[Feature]: "
labels: ["regulated", "validation"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for any feature in a GxP-regulated software product.
        One card = one User Requirement.

        After creating the issue, add it to the validation project board (a copy of
        `[TEMPLATE] Regulated Feature Lifecycle`) and set the **Risk ID**,
        **Requirement ID**, **Test Type**, **Critical-to-Quality**, **PQ Approver**,
        **PQ Signoff Date**, **QA Approver**, **QA Signoff Date**, and
        **Deviation Ref** fields on the card.

        The `User spec:` and `Feature link:` sections below are load-bearing —
        their exact labels are parsed by the gh-val validation tool. Do not
        rename them.

  - type: input
    id: risk-id
    attributes:
      label: "Risk ID:"
      description: |
        ID(s) from the canonical org-level risk register (Excel) that this feature
        addresses. Comma-separated if multiple. Example: `RISK-014, RISK-022`.
        Mirror this value into the project card's Risk ID field after creation.
    validations:
      required: true

  - type: input
    id: requirement-id
    attributes:
      label: "Requirement ID:"
      description: Identifier from the URS document. Example `REQ-024`. Mirror to the project card's Requirement ID field.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Brief description:"
      description: Plain-English description of the feature being validated.
    validations:
      required: true

  - type: textarea
    id: user-spec
    attributes:
      label: "User spec:"
      description: |
        URL to the `.spec` file holding the User Requirement Specification.
        Must be on the configured default branch and end with `.spec`.
        Parsed by gh-val — keep the label exact.
      placeholder: "https://github.com/<org>/<repo>/blob/<branch>/user_requirement_specification/<area>/<name>.spec"
    validations:
      required: true

  - type: textarea
    id: feature-link
    attributes:
      label: "Feature link:"
      description: |
        One URL per line. URLs to `.feature` files (Gherkin) that prove this requirement.
        Must be on the configured default branch and end with `.feature`.
        Parsed by gh-val — keep the label exact.
      placeholder: |
        https://github.com/<org>/<repo>/blob/<branch>/features/<area>/<name>.feature
    validations:
      required: true

  - type: checkboxes
    id: pq-review
    attributes:
      label: "PQ review checklist:"
      description: |
        Performance Qualification. An end-user representative — not the
        code author and not the test author — confirms the feature
        works against the URS in the operational environment. Tick all
        before advancing the card to PQ review status. The PQ Approver
        and PQ Signoff Date fields on the project card must be set
        before moving on to QA review.
      options:
        - label: Feature meets the user requirement in the operational environment
        - label: Workflow is usable in practice (not just technically passing)

  - type: checkboxes
    id: qa-review
    attributes:
      label: "QA review checklist:"
      description: |
        QA process oversight. QA (not the code author, not the test
        author, not the PQ reviewer) confirms the validation evidence
        is complete and the URS → V&V → PQ chain is intact. Tick all
        before advancing the card to QA approved. The QA Approver and
        QA Signoff Date fields on the project card must be set.
      options:
        - label: Risk linkage verified against the canonical risk register
        - label: URS → V&V evidence chain intact; any deviations are documented
