name: Regulated feature (V&V)
description: A user requirement / feature for a GxP-regulated build. Captures risk linkage, URS, and feature tests for ICH E6 (R3) traceability.
title: "[Feature]: "
labels: ["regulated", "validation"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for any feature in a GxP-regulated software product.
        One card = one User Requirement.

        Provide the **Risk ID**, **Requirement ID**, the **User spec** (URS), and
        the **Feature link(s)** below so the requirement can be traced through
        verification and validation.

        Acceptance and QA sign-off are **not recorded in this issue**. They are
        recorded in the project's validation workflow as attributable, dated
        approvals — an approver identity and a sign-off date — because a ticked
        checkbox records neither who attested nor when. What each approver will
        be asked to attest is set out at the bottom of this form, so the author
        knows what the requirement must be able to satisfy.

        Keep the section headings below unchanged — downstream validation
        tooling relies on them.

  - type: input
    id: risk-id
    attributes:
      label: "Risk ID:"
      description: |
        ID(s) from the project's risk register that this feature addresses.
        Comma-separated if multiple. Example: `RISK-014, RISK-022`.
    validations:
      required: true

  - type: input
    id: requirement-id
    attributes:
      label: "Requirement ID:"
      description: Identifier from the User Requirement Specification. Example `REQ-024`.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Brief description:"
      description: Plain-English description of the feature being validated.
    validations:
      required: true

  - type: textarea
    id: user-spec
    attributes:
      label: "User spec:"
      description: |
        URL to the `.spec` file holding the User Requirement Specification.
        Must be on the default branch and end with `.spec`.
      placeholder: "https://github.com/<org>/<repo>/blob/<branch>/user_requirement_specification/<area>/<name>.spec"
    validations:
      required: true

  - type: textarea
    id: feature-link
    attributes:
      label: "Feature link:"
      description: |
        One URL per line. URLs to `.feature` files (Gherkin) that prove this requirement.
        Must be on the default branch and end with `.feature`.
      placeholder: |
        https://github.com/<org>/<repo>/blob/<branch>/features/<area>/<name>.feature
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---

        ### What the approvers will attest

        Recorded in the project's validation workflow, not in this issue. Set
        out here so the meaning of each sign-off is known when the requirement
        is written, and so segregation of duties is planned for rather than
        discovered late.

        **User acceptance** — an end-user representative, who is neither the
        code author nor the test author, attests that:

        - the feature meets the user requirement against the URS in a
          development/test environment; and
        - the workflow is usable in practice, not just technically passing.

        **QA review** — QA, who is none of the code author, the test author or
        the acceptance approver, attests that:

        - risk linkage is verified against the project's risk register; and
        - the URS → V&V → acceptance chain is intact, with any deviations
          documented.
