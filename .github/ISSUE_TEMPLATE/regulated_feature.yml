name: Regulated feature (V&V)
description: A user requirement / feature for a GxP-regulated build. Captures risk linkage, URS, and feature tests for ICH E6 (R3) traceability.
title: "[Feature]: "
labels: ["regulated", "validation"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for any feature in a GxP-regulated software product.
        One card = one User Requirement.

        Provide the **Risk ID**, **Requirement ID**, the **User spec** (URS), and
        the **Feature link(s)** below so the requirement can be traced through
        verification and validation. Acceptance and QA are confirmed via the
        checklists at the bottom.

        Keep the section headings below unchanged — downstream validation
        tooling relies on them.

  - type: input
    id: risk-id
    attributes:
      label: "Risk ID:"
      description: |
        ID(s) from the project's risk register that this feature addresses.
        Comma-separated if multiple. Example: `RISK-014, RISK-022`.
    validations:
      required: true

  - type: input
    id: requirement-id
    attributes:
      label: "Requirement ID:"
      description: Identifier from the User Requirement Specification. Example `REQ-024`.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Brief description:"
      description: Plain-English description of the feature being validated.
    validations:
      required: true

  - type: textarea
    id: user-spec
    attributes:
      label: "User spec:"
      description: |
        URL to the `.spec` file holding the User Requirement Specification.
        Must be on the default branch and end with `.spec`.
      placeholder: "https://github.com/<org>/<repo>/blob/<branch>/user_requirement_specification/<area>/<name>.spec"
    validations:
      required: true

  - type: textarea
    id: feature-link
    attributes:
      label: "Feature link:"
      description: |
        One URL per line. URLs to `.feature` files (Gherkin) that prove this requirement.
        Must be on the default branch and end with `.feature`.
      placeholder: |
        https://github.com/<org>/<repo>/blob/<branch>/features/<area>/<name>.feature
    validations:
      required: true

  - type: checkboxes
    id: user-acceptance
    attributes:
      label: "User acceptance checklist:"
      description: |
        An end-user representative — not the code author and not the test
        author — confirms the feature meets the URS in a development/test
        environment. Tick all before advancing to user acceptance.
      options:
        - label: Feature meets the user requirement against the URS in a development/test environment
        - label: Workflow is usable in practice (not just technically passing)

  - type: checkboxes
    id: qa-review
    attributes:
      label: "QA review checklist:"
      description: |
        QA (not the code author, not the test author, not the acceptance
        reviewer) confirms the validation evidence is complete and the
        URS → V&V → user-acceptance chain is intact for this requirement.
        Tick all before advancing to QA approved.
      options:
        - label: Risk linkage verified against the risk register
        - label: URS → V&V evidence chain intact; any deviations are documented
