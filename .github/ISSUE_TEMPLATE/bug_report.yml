name: Bug Report
description: Report a defect in a production or test system
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For production clinical systems,
        please also notify the system administrator directly if this
        affects patient-facing functionality.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Per our operations guide severity definitions
      options:
        - Critical (system unusable / patient safety)
        - High (major function broken, no workaround)
        - Medium (workaround available)
        - Low (cosmetic / minor)
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging / UAT
        - Development
        - Alpha test
        - Beta test
    validations:
      required: true
  - type: input
    id: application
    attributes:
      label: Application / Component
      placeholder: e.g. GTG Web, trial-matching-api
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS (if applicable)
      placeholder: e.g. Chrome 120 on Windows 11
  - type: checkboxes
    id: phi
    attributes:
      label: Patient data
      options:
        - label: I have NOT included any patient-identifiable information in this report
          required: true
