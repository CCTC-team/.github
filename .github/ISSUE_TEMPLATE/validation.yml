name: Validation & Verification (CCTC Components variant)
description: V&V card for products whose tests are split into Functional scripts (.feature) and Test files (.cs / .fs). Use feature.yml for the REDCap-style URS + Feature link layout.
title: "[V&V]: "
labels: ["validation", "regulated", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For GCP V&V where the test artefacts are split into **Functional scripts**
        (Gherkin `.feature` files) and **Test files** (`.cs` / `.fs` step definitions).
        Card = one User Requirement.

        After creating the issue, add it to the validation project board
        (a copy of `[TEMPLATE] Regulatory Compliance`) and set the **Risk ID**,
        **Requirement ID**, **Test Type**, **Critical-to-Quality**,
        **Approver**, **QA Signoff Date**, and **Deviation Ref** fields on the card.

        The `User specs:`, `Functional scripts:`, and `Test files:` section
        labels are parsed by gh-val (CCTC_Components variant). Do not rename them.

  - type: input
    id: risk-id
    attributes:
      label: "Risk ID:"
      description: |
        ID(s) from the canonical org-level risk register (Excel). Comma-separated
        if multiple. Example: `RISK-014, RISK-022`. Mirror to the project card's
        Risk ID field after creation.
    validations:
      required: true

  - type: input
    id: requirement-id
    attributes:
      label: "Requirement ID:"
      description: Identifier from the URS document. Example `REQ-024`.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Brief description:"
      description: Plain-English description of the feature being validated.
    validations:
      required: true

  - type: textarea
    id: user-specs
    attributes:
      label: "User specs:"
      description: |
        URL to the `.spec` file(s) holding the User Requirement Specification.
        Must be on the configured default branch and end with `.spec`.
        Parsed by gh-val — keep the label exact.
      placeholder: "https://github.com/CCTC-team/<repo>/blob/<branch>/user_requirement_specification/features/<n>_<name>.spec"
    validations:
      required: true

  - type: textarea
    id: functional-scripts
    attributes:
      label: "Functional scripts:"
      description: |
        One URL per line. Gherkin `.feature` files describing functional scenarios.
        Must be on the configured default branch and end with `.feature`.
        Parsed by gh-val — keep the label exact.
      placeholder: |
        https://github.com/CCTC-team/<repo>/blob/<branch>/features/<name>.feature
    validations:
      required: true

  - type: textarea
    id: test-files
    attributes:
      label: "Test files:"
      description: |
        One URL per line. Step-definition / test source files.
        Must be on the configured default branch and end with `.cs` or `.fs`.
        Parsed by gh-val — keep the label exact.
      placeholder: |
        https://github.com/CCTC-team/<repo>/blob/<branch>/tests/<name>.cs
        https://github.com/CCTC-team/<repo>/blob/<branch>/tests/<name>.fs
    validations:
      required: true

  - type: checkboxes
    id: pre-review
    attributes:
      label: "Pre review:"
      description: Reviewer (not the test author) confirms before tests are executed.
      options:
        - label: Script(s) target the correct feature sufficiently
        - label: The user requirements are met

  - type: checkboxes
    id: post-review
    attributes:
      label: "Post review:"
      description: Reviewer (not the test author) confirms after tests are executed against the validated environment.
      options:
        - label: Script(s) target the correct feature sufficiently
        - label: Script(s) appropriately test the feature
