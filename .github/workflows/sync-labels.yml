name: Sync labels across org

on:
  # Run when the label manifest changes
  push:
    branches: [main]
    paths:
      - labels.json
      - scripts/sync-labels.sh
      - .github/workflows/sync-labels.yml
  # Nightly drift-correction
  schedule:
    - cron: "17 3 * * *"
  # Manual run
  workflow_dispatch:
    inputs:
      repos:
        description: "Space-separated list of repo names to sync (leave empty for all)"
        required: false
        default: ""

jobs:
  sync:
    # Self-hosted CCTC runner (see infrastructure/runners/README.md in
    # server-structure). Org credits are exhausted; this is the bridge.
    # Safe because the .github repo is private — see "Security boundaries"
    # in the runner README.
    runs-on: [self-hosted, linux, cctc]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Verify required CLIs are present
        run: |
          command -v gh >/dev/null || { echo "gh not found on runner image"; exit 1; }
          command -v jq >/dev/null || { echo "jq not found on runner image"; exit 1; }

      # Mint a short-lived installation token for the org-installed GitHub App.
      # Requires two org secrets:
      #   ORG_LABEL_SYNC_APP_CLIENT_ID   — the App's Client ID (Iv23li…)
      #   ORG_LABEL_SYNC_APP_PRIVATE_KEY — full contents of the App's .pem private key
      # The App must be installed across the org with Issues: read & write.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ORG_LABEL_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_LABEL_SYNC_APP_PRIVATE_KEY }}
          owner: CCTC-team

      - name: Sync labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: CCTC-team
        run: |
          if [ -n "${{ github.event.inputs.repos }}" ]; then
            ./scripts/sync-labels.sh ${{ github.event.inputs.repos }}
          else
            ./scripts/sync-labels.sh
          fi
