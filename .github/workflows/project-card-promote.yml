name: Project card promote (reusable)

# PR-driven automatic promotion of regulated lifecycle cards. Called
# from a regulated repo's `.github/workflows/project-card-promote.yml`
# (the caller template) on every PR open / sync / close and on
# check_suite.completed.
#
# Only the automatic states (Code review, V&V tests pass) can be the
# target of automation. User acceptance, QA approved, Released are
# human-attested and must never be reached by this workflow — see the
# state-machine constants in scripts/project_enforcement/promote.py.
#
# All untrusted inputs (PR titles, project field values, issue body
# fragments) reach Python only via environment variables that are then
# read with `os.environ`. We never interpolate `${{ }}` into the body
# of a heredoc — matches the discipline the gxp-traceability gate
# already uses.

on:
  workflow_call:
    inputs:
      project_owner:
        description: "Org (or user) that owns the regulated lifecycle project."
        type: string
        required: true
      project_number:
        description: "ProjectV2 number (NOT defaulted — pass from vars.LIFECYCLE_PROJECT_NUMBER)."
        type: string
        required: true
      status_field_name:
        description: "Single-select field on the project that holds the regulated lifecycle status."
        type: string
        default: "Status"
    secrets:
      app_client_id:
        description: "Client ID of the project-enforcement App. Required if you want cross-repo project writes."
        required: false
      app_private_key:
        description: "Private key (.pem contents) for the project-enforcement App."
        required: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Resolve event metadata
        id: meta
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_ACTION: ${{ github.event.action }}
          CHECK_CONCLUSION: ${{ github.event.check_suite.conclusion }}
        run: |
          set -e
          case "$GH_EVENT_NAME:$GH_ACTION" in
            pull_request:opened|pull_request:reopened|pull_request:synchronize)
              echo "event=pull_request_opened" >> "$GITHUB_OUTPUT"
              ;;
            pull_request:closed)
              echo "event=pull_request_closed" >> "$GITHUB_OUTPUT"
              ;;
            check_suite:completed)
              echo "event=check_suite_completed" >> "$GITHUB_OUTPUT"
              echo "check_conclusion=${CHECK_CONCLUSION}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "event=unknown" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Guard — bail if LIFECYCLE_PROJECT_NUMBER not set
        id: guard
        env:
          PROJECT_NUMBER: ${{ inputs.project_number }}
          APP_CLIENT_ID: ${{ secrets.app_client_id }}
        run: |
          if [ -z "$PROJECT_NUMBER" ] || [ "$PROJECT_NUMBER" = "0" ]; then
            {
              echo "## Project card promote"
              echo ""
              echo "_No \`LIFECYCLE_PROJECT_NUMBER\` set on this repo — promotion skipped._"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # `secrets` cannot be referenced in a step `if:`, so surface whether the
          # App credentials are present as an output the later steps can gate on.
          if [ -n "$APP_CLIENT_ID" ]; then
            echo "has_app_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app_creds=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout .github
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          repository: CCTC-team/.github
          path: _enforcement
          ref: main

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 -m venv /tmp/promote
          /tmp/promote/bin/pip install --quiet --upgrade pip
          /tmp/promote/bin/pip install --quiet 'pyyaml>=6'

      # Cross-repo project writes need a token with `write:project` —
      # the default GITHUB_TOKEN does not have org-level project scope.
      # The caller passes its org's project-enforcement App credentials
      # in via the `app_client_id` / `app_private_key` secrets; if
      # absent we fall back to github.token, which will fail at the
      # mutation step (and the run will surface that clearly).
      - name: Generate app token
        if: steps.guard.outputs.skip != 'true' && steps.guard.outputs.has_app_creds == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ inputs.project_owner }}

      - name: Resolve project + linked issue context
        if: steps.guard.outputs.skip != 'true'
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PROJECT_OWNER: ${{ inputs.project_owner }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          STATUS_FIELD: ${{ inputs.status_field_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number }}
        run: |
          set -e
          gh api graphql -F number="$PR_NUMBER" \
            -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    state merged
                    closingIssuesReferences(first: 5) {
                      nodes {
                        number
                        labels(first: 10) { nodes { name } }
                        projectItems(first: 20) {
                          nodes {
                            id
                            project { id number title }
                            fieldValues(first: 30) {
                              nodes {
                                ... on ProjectV2ItemFieldSingleSelectValue {
                                  name field { ... on ProjectV2FieldCommon { name } }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' > pr.json

          # All inputs read from os.environ — never interpolated.
          /tmp/promote/bin/python <<'PY'
          import json, os
          number = int(os.environ["PROJECT_NUMBER"])
          status_field = os.environ["STATUS_FIELD"]
          with open("pr.json") as f:
              d = json.load(f)
          pr = ((d.get("data") or {}).get("repository") or {}).get("pullRequest") or {}
          issues = (pr.get("closingIssuesReferences") or {}).get("nodes", []) or []
          resolved_project_id = ""
          item_id = ""
          current_status = ""
          for issue in issues:
              labels = {l["name"] for l in (issue.get("labels") or {}).get("nodes", []) or []}
              if "regulated" not in labels:
                  continue
              for pi in (issue.get("projectItems") or {}).get("nodes", []) or []:
                  proj = pi.get("project") or {}
                  if proj.get("number") != number:
                      continue
                  resolved_project_id = proj.get("id") or ""
                  item_id = pi.get("id") or ""
                  for fv in (pi.get("fieldValues") or {}).get("nodes", []) or []:
                      field_name = ((fv.get("field") or {}).get("name") or "")
                      if field_name == status_field:
                          current_status = fv.get("name") or ""
                  break
              if resolved_project_id:
                  break
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"resolved_project_id={resolved_project_id}\n")
              out.write(f"item_id={item_id}\n")
              out.write(f"current_status={current_status}\n")
              out.write(f"pr_state={(pr.get('state') or '').lower()}\n")
              out.write(f"pr_merged={'true' if pr.get('merged') else 'false'}\n")
          PY

      - name: Resolve allowlist + decision
        if: steps.guard.outputs.skip != 'true'
        id: decide
        env:
          PYTHONPATH: ${{ github.workspace }}/_enforcement/scripts
          ENF_REPO_PATH: ${{ github.workspace }}/_enforcement
          PROJECT_NUMBER: ${{ inputs.project_number }}
          PE_EVENT: ${{ steps.meta.outputs.event }}
          PE_CHECK_CONCLUSION: ${{ steps.meta.outputs.check_conclusion }}
          PE_RESOLVED_PROJECT_ID: ${{ steps.resolve.outputs.resolved_project_id }}
          PE_CURRENT_STATUS: ${{ steps.resolve.outputs.current_status }}
          PE_PR_STATE: ${{ steps.resolve.outputs.pr_state }}
          PE_PR_MERGED: ${{ steps.resolve.outputs.pr_merged }}
        run: |
          set -e
          /tmp/promote/bin/python <<'PY'
          import os, sys, yaml
          sys.path.insert(0, os.path.join(os.environ["ENF_REPO_PATH"], "scripts"))
          from project_enforcement.promote import decide

          cfg_path = os.path.join(os.environ["ENF_REPO_PATH"], ".github", "project-enforcement.yml")
          cfg = yaml.safe_load(open(cfg_path)) or {}
          allowed_numbers = {str(p.get("number")) for p in (cfg.get("projects") or [])}

          project_number = os.environ["PROJECT_NUMBER"]
          resolved = os.environ["PE_RESOLVED_PROJECT_ID"] or None
          if project_number not in allowed_numbers:
              # Project number not listed in .github/project-enforcement.yml.
              decision = decide(
                  event=os.environ["PE_EVENT"],
                  project_number=project_number,
                  allowed_project_ids=[],
                  resolved_project_id=None,
                  current_status=os.environ["PE_CURRENT_STATUS"] or None,
              )
          else:
              decision = decide(
                  event=os.environ["PE_EVENT"],
                  project_number=project_number,
                  allowed_project_ids=[resolved] if resolved else [],
                  resolved_project_id=resolved,
                  current_status=os.environ["PE_CURRENT_STATUS"] or None,
                  pr_state=os.environ["PE_PR_STATE"] or None,
                  pr_merged=os.environ["PE_PR_MERGED"] == "true",
                  check_conclusion=os.environ["PE_CHECK_CONCLUSION"] or None,
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"action={decision.action}\n")
              out.write(f"reason={decision.reason}\n")
              out.write(f"target_status={decision.target_status or ''}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## Project card promote\n\n")
              s.write(f"- Event: `{os.environ['PE_EVENT']}`\n")
              s.write(f"- Current status: `{os.environ['PE_CURRENT_STATUS'] or '_unknown_'}`\n")
              s.write(f"- Decision: `{decision.action}` — {decision.reason}\n")
              if decision.target_status:
                  s.write(f"- Target: `{decision.target_status}`\n")
          PY

      - name: Apply move
        if: steps.guard.outputs.skip != 'true' && steps.decide.outputs.action == 'move'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PROJECT_ID: ${{ steps.resolve.outputs.resolved_project_id }}
          ITEM_ID: ${{ steps.resolve.outputs.item_id }}
          TARGET_STATUS: ${{ steps.decide.outputs.target_status }}
          STATUS_FIELD: ${{ inputs.status_field_name }}
        run: |
          set -e
          gh api graphql -f query='
            query($project: ID!) {
              node(id: $project) {
                ... on ProjectV2 {
                  fields(first: 50) {
                    nodes {
                      __typename
                      ... on ProjectV2SingleSelectField {
                        id name options { id name }
                      }
                    }
                  }
                }
              }
            }' -F project="$PROJECT_ID" > fields.json

          /tmp/promote/bin/python <<'PY'
          import json, os, sys
          field_name = os.environ["STATUS_FIELD"]
          target = os.environ["TARGET_STATUS"]
          with open("fields.json") as f:
              d = json.load(f)
          fields = (((d.get("data") or {}).get("node") or {}).get("fields") or {}).get("nodes") or []
          for fld in fields:
              if fld.get("__typename") != "ProjectV2SingleSelectField":
                  continue
              if fld.get("name") != field_name:
                  continue
              for opt in fld.get("options") or []:
                  if opt.get("name") == target:
                      with open(os.environ["GITHUB_ENV"], "a") as env:
                          env.write(f"FIELD_ID={fld['id']}\n")
                          env.write(f"OPTION_ID={opt['id']}\n")
                      sys.exit(0)
          sys.exit(f"Could not resolve field/option ids for {field_name}={target}")
          PY

          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(
                input: { projectId: $project, itemId: $item, fieldId: $field,
                         value: { singleSelectOptionId: $option } }
              ) { projectV2Item { id } }
            }' \
            -F project="$PROJECT_ID" -F item="$ITEM_ID" \
            -F field="$FIELD_ID" -f option="$OPTION_ID"
