name: Compliance check (reusable)

# Reusable workflow that regulated repos opt into. Validates the repo's
# .compliance.yml against the locally-co-located compliance.schema.json
# (kept in sync by the compliance-drift workflow in CCTC-team/.github).
#
# Caller example (.github/workflows/compliance.yml in a regulated repo):
#
#   name: Compliance check
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
#   jobs:
#     compliance:
#       uses: CCTC-team/.github/.github/workflows/compliance-check.yml@main

on:
  workflow_call:
    inputs:
      schema_path:
        description: "Path to compliance.schema.json inside the caller repo."
        type: string
        default: ".github/compliance.schema.json"
      compliance_path:
        description: "Path to .compliance.yml inside the caller repo."
        type: string
        default: ".compliance.yml"
      readme_path:
        description: "Path to the README that should carry the banner."
        type: string
        default: "README.md"
      supported_schema_versions:
        description: "Comma-separated list of schema_version values this validator accepts."
        type: string
        default: "1"
      contract_enforcement:
        description: "active | evaluate. Controls the build-target contract check: evaluate warns, active fails. (Schema validation always hard-fails.)"
        type: string
        default: "evaluate"
      tooling_ref:
        description: "Ref of CCTC-team/.github to load the contract checker (scripts/release) from."
        type: string
        default: "main"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Checkout contract checker tooling
        uses: actions/checkout@v6
        with:
          repository: CCTC-team/.github
          ref: ${{ inputs.tooling_ref }}
          path: _release-tooling

      - name: Ensure required files are present
        run: |
          missing=0
          for f in "${{ inputs.schema_path }}" "${{ inputs.compliance_path }}" "${{ inputs.readme_path }}" "CONTRIBUTING-regulated.md"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required compliance file missing"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Install validator (check-jsonschema)
        run: |
          python3 -m venv /tmp/cjs
          /tmp/cjs/bin/pip install --quiet --upgrade pip
          /tmp/cjs/bin/pip install --quiet 'check-jsonschema>=0.29' 'pyyaml>=6'

      - name: Validate .compliance.yml against schema
        run: |
          /tmp/cjs/bin/check-jsonschema \
            --schemafile "${{ inputs.schema_path }}" \
            "${{ inputs.compliance_path }}"

      - name: Check schema_version is supported by this validator
        env:
          SUPPORTED: ${{ inputs.supported_schema_versions }}
        run: |
          declared=$(/tmp/cjs/bin/python <<'PY'
          import yaml
          print(yaml.safe_load(open("${{ inputs.compliance_path }}"))["schema_version"])
          PY
          )
          case ",$SUPPORTED," in
            *,"$declared",*) echo "schema_version=$declared is supported." ;;
            *)
              echo "::error::schema_version=$declared is not in supported set [$SUPPORTED]. Upgrade the validator (compliance-check.yml) before bumping repo schemas."
              exit 1
              ;;
          esac

      - name: Check README banner marker is present
        run: |
          if ! grep -qF "compliance:banner" "${{ inputs.readme_path }}"; then
            echo "::error file=${{ inputs.readme_path }}::Missing '<!-- compliance:banner -->' marker. Regulated repos must carry the org banner."
            exit 1
          fi

      - name: Check review is in date
        run: |
          extracted=$(/tmp/cjs/bin/python <<'PY'
          import yaml
          d = yaml.safe_load(open("${{ inputs.compliance_path }}"))
          print(d["last_reviewed"])
          print(d.get("review_cadence_months", 12))
          PY
          )
          reviewed=$(echo "$extracted" | sed -n 1p)
          cadence=$(echo "$extracted" | sed -n 2p)
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$reviewed" +%s) ) / 86400 ))
          max_days=$(( cadence * 30 ))
          if [ "$age_days" -lt 0 ]; then
            echo "::error::Compliance metadata last_reviewed=$reviewed is in the future. Set it to today or earlier."
            exit 1
          fi
          if [ "$age_days" -gt "$max_days" ]; then
            echo "::error::Compliance metadata last reviewed $reviewed ($age_days days ago), exceeds cadence of $cadence months ($max_days days)."
            exit 1
          fi
          echo "Compliance metadata reviewed $reviewed ($age_days days ago, cadence $cadence months)."

      # Build-target contract: a regulated repo must declare every mandatory
      # target (tag, validation-docs, sbom, …) in its release-targets manifest.
      # evaluate -> warn; active -> fail. Schema validation above always
      # hard-fails; this check graduates separately like the other controls.
      - name: Check the build-target contract
        env:
          COMPLIANCE_PATH: ${{ inputs.compliance_path }}
          CONTRACT_ENFORCEMENT: ${{ inputs.contract_enforcement }}
        run: |
          tier=$(/tmp/cjs/bin/python <<'PY'
          import os, yaml
          d = yaml.safe_load(open(os.environ["COMPLIANCE_PATH"])) or {}
          print(d.get("regulatory_tier") or "")
          PY
          )
          if [ "$tier" = "none" ] || [ -z "$tier" ]; then
            echo "regulatory_tier=$tier — build-target contract not applicable."
            exit 0
          fi
          manifest=$(/tmp/cjs/bin/python <<'PY'
          import os, yaml
          d = yaml.safe_load(open(os.environ["COMPLIANCE_PATH"])) or {}
          print(d.get("release_targets_path") or ".github/release-targets.yml")
          PY
          )
          emit() {
            if [ "$CONTRACT_ENFORCEMENT" = "active" ]; then echo "::error::$*"; else echo "::warning::[evaluate-mode] $*"; fi
          }
          status=0
          if [ ! -f "$manifest" ]; then
            emit "No release-targets manifest at $manifest. A regulated repo must declare its build targets (drift stubs one from the worked example)."
            status=1
          else
            problems=$(TIER="$tier" MANIFEST="$manifest" PYTHONPATH="$GITHUB_WORKSPACE/_release-tooling/scripts" /tmp/cjs/bin/python <<'PY'
          import os, yaml
          from release import contract
          m = yaml.safe_load(open(os.environ["MANIFEST"])) or {}
          for p in contract.check_manifest(m, os.environ["TIER"]):
              print(p)
          PY
            )
            if [ -n "$problems" ]; then
              while IFS= read -r p; do emit "release-targets contract: $p"; done <<< "$problems"
              status=1
            else
              echo "Build-target contract satisfied for tier $tier."
            fi
          fi
          if [ "$CONTRACT_ENFORCEMENT" = "active" ] && [ "$status" != "0" ]; then
            exit 1
          fi

      - name: Surface compliance summary
        if: always()
        run: |
          {
            echo "### Compliance metadata"
            echo
            echo '```yaml'
            cat "${{ inputs.compliance_path }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
