name: Release (reusable)

# Reusable release workflow for regulated repos. Builds the repo's container
# image(s) in CI, pushes each to GHCR by immutable digest, generates the SBOM and
# validation evidence, and cuts a GitHub Release carrying a SIGNED release
# manifest (tag -> per-component digest). The on-server pull-agent verifies the
# manifest's SSH signature and deploys exactly those digests; nothing here ever
# pushes into a server.
#
# A repo may ship MORE THAN ONE image (a UI host and an API, an app and its
# docs site, …). It declares the set under `images` (keyed by component) in
# .github/release-targets.yml; this workflow builds them all and records every
# component's digest in the one signed manifest. One repo -> one version -> one
# Release -> N images, deployed atomically by the agent.
#
# Provenance note: GitHub artifact attestations are NOT used — persisting them for
# a private repo needs GitHub Enterprise Cloud, which this org does not have. The
# signed manifest (org SSH key, verified against the agent's allowed_signers) plus
# content-addressed digests give the equivalent origin + integrity guarantee with
# no licence. See docs/release-provenance-risk-assessment.md.
#
# Every build action is bound through the caller repo's release-targets.yml
# manifest (schema: release-targets.schema.json) — this workflow hardcodes NO
# repo-specific path, filename, or build command.
#
# Security posture mirrors gxp-traceability.yml: untrusted issue/PR bodies are
# read from files and passed to Python as data, never interpolated into a shell
# or into Python source. The manifest's `run` strings ARE executed — that is the
# repo's own trusted build config (like a Makefile), by design (Decision 8).
#
# enforcement input:
#   "evaluate" (default) — cut a DRAFT Release with the full artifact set; the
#       vulnerability scan warns but does not fail. The pull-agent ignores drafts,
#       so nothing auto-deploys. Use this to inspect output during rollout.
#   "active" — the vulnerability scan fails on critical/high. With no
#       `approvers_team`, cut a PUBLISHED Release directly. With `approvers_team`
#       set, cut a DRAFT and open a digest-bound authorisation issue in the caller
#       repo; a member of that team who is NOT the release author publishes it by
#       commenting `/approve` (release-authorize.yml). This is the Team-compatible
#       equivalent of an Enterprise `production` Environment gate — see
#       docs/release-authorisation.md.
#
# Caller example (.github/workflows/release.yml in a regulated repo): see
# templates/compliance/release-caller.yml.

on:
  workflow_call:
    inputs:
      tag:
        description: "The v* tag to release (e.g. v1.4.0). Must be a signed tag."
        type: string
        required: true
      milestone:
        description: "Milestone title scoping this release. Defaults to the tag."
        type: string
        default: ""
      compliance_path:
        description: "Path to .compliance.yml in the caller repo."
        type: string
        default: ".compliance.yml"
      enforcement:
        description: "evaluate | active. evaluate cuts a draft and warns on vulns; active publishes and fails on critical/high."
        type: string
        default: "evaluate"
      approvers_team:
        description: "Org team slug whose members authorise an active release by commenting /approve on the authorisation issue (e.g. qa-approvers). When set with enforcement: active, the release is cut as a draft and published only on /approve. Empty publishes directly."
        type: string
        default: ""
      tooling_ref:
        description: "Ref of CCTC-team/.github to load the release tooling (scripts/release) from."
        type: string
        default: "main"
    secrets:
      release_signing_key:
        description: "Private ed25519 SSH key (OpenSSH format) that signs the release manifest. Org-level secret RELEASE_SIGNING_KEY; see docs/release-signing-setup.md."
        required: false

# Run the bundled JavaScript actions (upload/download-artifact) on Node 24 now.
# Their current majors still ship a Node 20 runtime, which GitHub defaults away
# from on 2026-06-16 and removes on 2026-09-16; opting in here validates Node 24
# ahead of that flip. Drop this once those actions ship Node 24 natively.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Build every component image, push by digest, generate the regulated evidence,
  # and assemble the image set (plus the unsigned release manifest). No publish of
  # the Release here (that may be gated by an Environment); the manifest is signed
  # in the release job, away from any repo build command.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: read
      pull-requests: read
    outputs:
      applicable: ${{ steps.gate.outputs.applicable }}
    env:
      TAG: ${{ inputs.tag }}
      ENFORCEMENT: ${{ inputs.enforcement }}
      COMPLIANCE_PATH: ${{ inputs.compliance_path }}
      REPO: ${{ github.repository }}
      STATE_DIR: ${{ github.workspace }}/_release-state
      TOOLING: ${{ github.workspace }}/_release-tooling/scripts
    steps:
      - name: Checkout caller at the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Checkout release tooling
        uses: actions/checkout@v6
        with:
          repository: CCTC-team/.github
          ref: ${{ inputs.tooling_ref }}
          path: _release-tooling

      - name: Set up Python
        run: |
          python3 -m venv /tmp/release
          /tmp/release/bin/pip install --quiet --upgrade pip
          /tmp/release/bin/pip install --quiet 'pyyaml>=6'
          mkdir -p "$STATE_DIR"

      # Gate: regulated repos only. Not regulated (no .compliance.yml, or
      # regulatory_tier == none) -> every later step is skipped, job succeeds.
      - name: Gate on regulatory tier
        id: gate
        run: |
          if [ ! -f "$COMPLIANCE_PATH" ]; then
            echo "No $COMPLIANCE_PATH — repo not regulated; nothing to release."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tier=$(/tmp/release/bin/python <<'PY'
          import os, yaml
          d = yaml.safe_load(open(os.environ["COMPLIANCE_PATH"])) or {}
          print(d.get("regulatory_tier") or "")
          PY
          )
          if [ "$tier" = "none" ] || [ -z "$tier" ]; then
            echo "regulatory_tier=$tier — release workflow not applicable."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "regulatory_tier=$tier"
          echo "applicable=true" >> "$GITHUB_OUTPUT"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"

      - name: Resolve manifest and check the build-target contract
        if: steps.gate.outputs.applicable == 'true'
        env:
          TIER: ${{ steps.gate.outputs.tier }}
        run: |
          manifest_path=$(/tmp/release/bin/python <<'PY'
          import os, yaml
          d = yaml.safe_load(open(os.environ["COMPLIANCE_PATH"])) or {}
          print(d.get("release_targets_path") or ".github/release-targets.yml")
          PY
          )
          # Persist for later steps (cross-step), and export for THIS step — a
          # value written to $GITHUB_ENV is not visible within the step that
          # writes it, so the contract check below reads it from the process env.
          echo "MANIFEST=$manifest_path" >> "$GITHUB_ENV"
          export MANIFEST="$manifest_path"
          if [ ! -f "$manifest_path" ]; then
            echo "::error file=$manifest_path::release-targets manifest not found. A regulated repo must declare its build targets."
            exit 1
          fi
          PYTHONPATH="$TOOLING" /tmp/release/bin/python <<'PY'
          import os, sys, yaml
          from release import contract
          m = yaml.safe_load(open(os.environ["MANIFEST"])) or {}
          problems = contract.check_manifest(m, os.environ["TIER"])
          if problems:
              for p in problems:
                  print(f"::error::release-targets contract: {p}")
              sys.exit(1)
          print("Build-target contract satisfied.")
          PY

      # Refuse to release an unsigned tag. A lightweight tag (no tag object) or
      # an annotated tag without a signature block is rejected. Full trust
      # verification depends on the runner's key/allowed-signers store; presence
      # of a signature proves `git tag -s` was used.
      - name: Verify the release tag is signed
        if: steps.gate.outputs.applicable == 'true'
        run: |
          obj_type=$(git cat-file -t "$TAG" || true)
          if [ "$obj_type" != "tag" ]; then
            echo "::error::$TAG is not an annotated tag object — it cannot be signed. Use 'git tag -s'."
            exit 1
          fi
          if ! git cat-file -p "$TAG" | grep -qE 'BEGIN (PGP|SSH) SIGNATURE'; then
            echo "::error::$TAG carries no signature. Regulated releases require a signed tag ('git tag -s')."
            exit 1
          fi
          echo "$TAG is a signed annotated tag."

      - name: Derive version and pin it for the build
        if: steps.gate.outputs.applicable == 'true'
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          pin_env=$(PYTHONPATH="$TOOLING" /tmp/release/bin/python -m release.manifest --manifest "$MANIFEST" --version-pin-env || true)
          if [ -n "$pin_env" ]; then
            echo "$pin_env=$version" >> "$GITHUB_ENV"
            echo "Pinned $pin_env=$version"
          fi

      # Build -> package (all OCI images) -> publish to GHCR by digest. Building
      # here, in the hardened runner, is what the signed manifest commits to.
      # The publish:registry target MUST export EACH component's pushed digest to
      # $GITHUB_ENV under that image's images.<name>.digest_env (e.g.
      # <APP>_IMAGE_DIGEST=sha256:..., <APP>_API_IMAGE_DIGEST=sha256:...).
      - name: Build, package, and publish the images
        if: steps.gate.outputs.applicable == 'true'
        # Expose the workflow token so a repo's build commands can authenticate to
        # private dependency feeds and push images to GHCR. It is passed as an env
        # var (never interpolated into a shell string) per this file's posture; the
        # `packages: write` permission above scopes the GHCR push.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          run_target() {
            local name="$1"
            local cmd
            if ! cmd=$(PYTHONPATH="$TOOLING" /tmp/release/bin/python -m release.manifest --manifest "$MANIFEST" --run "$name"); then
              echo "::error::Mandatory target '$name' is not declared in $MANIFEST."
              return 1
            fi
            echo "::group::$name"
            echo "+ $cmd"
            # Run the target, capturing its real exit code so a failure still
            # closes the log group before propagating. `|| rc=$?` keeps `set -e`
            # from aborting here AND records the genuine status — unlike
            # `if ! cmd; then rc=$?`, where `$?` inside the branch is the negated
            # (always-zero) status of `! cmd`, which would silently swallow a
            # failed build/package/publish and limp on to later steps.
            local rc=0
            bash -c "$cmd" || rc=$?
            echo "::endgroup::"
            return $rc
          }
          run_target build
          run_target package
          run_target "publish:registry"

      # Generate the SBOMs (one per image, per the contract). The files are
      # resolved per-component below from each image's declared globs.
      - name: Generate the SBOM(s)
        if: steps.gate.outputs.applicable == 'true'
        run: |
          cmd=$(PYTHONPATH="$TOOLING" /tmp/release/bin/python -m release.manifest --manifest "$MANIFEST" --run sbom)
          echo "+ $cmd"
          bash -c "$cmd"

      # Assemble the released image set: for each declared component, read back
      # its pushed digest, resolve its SBOM file, and emit the matrix-facing JSON
      # plus an internal images.json (with source paths) for the steps below.
      - name: Resolve digests and assemble the image set
        id: images
        if: steps.gate.outputs.applicable == 'true'
        run: |
          PYTHONPATH="$TOOLING" /tmp/release/bin/python <<'PY'
          import glob, json, os, re

          from release import manifest as M

          m = M.load(os.environ["MANIFEST"])
          names = M.component_names(m)
          if not names:
              print("::error::No images declared in the manifest. This release workflow builds container-image repos; declare images[] (a package-only repo is not yet supported).")
              raise SystemExit(1)

          target_sbom_globs = M.outputs(m, "sbom")
          state = os.environ["STATE_DIR"]
          images = []
          for name in names:
              ref = M.component_ref(m, name)
              digest_env = M.component_digest_env(m, name)
              digest = os.environ.get(digest_env or "", "")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  print(f"::error::publish:registry did not export a valid sha256 digest for component '{name}' to ${digest_env} (got '{digest or '<empty>'}'). It must write {digest_env}=sha256:... to $GITHUB_ENV.")
                  raise SystemExit(1)
              globs = M.component_sbom_globs(m, name) or target_sbom_globs
              sbom_src = ""
              for g in globs:
                  hits = sorted(glob.glob(g))
                  if hits:
                      sbom_src = hits[0]
                      break
              if not sbom_src:
                  print(f"::error::No SBOM file found for component '{name}' (looked in: {globs or '[]'}). Each image needs an SBOM.")
                  raise SystemExit(1)
              images.append({
                  "name": name,
                  "ref": ref,
                  "digest": digest,
                  "sbom": os.path.basename(sbom_src),
                  "sbom_src": sbom_src,
              })

          with open(os.path.join(state, "images.json"), "w") as f:
              json.dump(images, f)
          # Matrix-facing form drops the build-local source path.
          matrix = [{k: v for k, v in img.items() if k != "sbom_src"} for img in images]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("json=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          for img in images:
              print(f"Released image: {img['ref']}@{img['digest']}  (sbom: {img['sbom']})")
          PY

      - name: Install grype
        if: steps.gate.outputs.applicable == 'true'
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      # One scan per image SBOM; the gate aggregates — in active mode the release
      # fails if ANY image carries a critical/high finding. A scan that does not
      # complete (e.g. grype's vulnerability DB fails to download) fails the build
      # in BOTH modes — an unscanned image is never certified as clean.
      - name: Vulnerability scan
        if: steps.gate.outputs.applicable == 'true'
        run: |
          blocking=$(PYTHONPATH="$TOOLING" /tmp/release/bin/python <<'PY'
          import json, os, subprocess, sys

          from release import sbom_scan

          state = os.environ["STATE_DIR"]
          images = json.load(open(os.path.join(state, "images.json")))
          any_blocking = False
          summary = []
          for img in images:
              proc = subprocess.run(
                  ["grype", f"sbom:{img['sbom_src']}", "-o", "json"],
                  capture_output=True, text=True,
              )
              try:
                  result = sbom_scan.load(
                      proc.stdout, returncode=proc.returncode, stderr=proc.stderr
                  )
              except sbom_scan.ScanError as exc:
                  print(f"grype did not complete for {img['name']}: {exc}", file=sys.stderr)
                  sys.exit(3)
              summary.append(f"### {img['name']}\n\n{result.markdown}")
              any_blocking = any_blocking or result.has_blocking
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(summary))
          print("1" if any_blocking else "0")
          PY
          ) || {
            echo "::error::Vulnerability scan did not complete (see stderr above) — refusing to release without a successful scan."
            exit 1
          }
          if [ "$blocking" = "1" ]; then
            if [ "$ENFORCEMENT" = "active" ]; then
              echo "::error::Critical/High vulnerabilities present in at least one image — failing active release."
              exit 1
            fi
            echo "::warning::[evaluate-mode] Critical/High vulnerabilities present — would fail in active mode."
          fi

      # Validation report (regulated-mandatory). No report -> no Release.
      - name: Generate the validation report
        if: steps.gate.outputs.applicable == 'true'
        run: |
          cmd=$(PYTHONPATH="$TOOLING" /tmp/release/bin/python -m release.manifest --manifest "$MANIFEST" --run validation-docs)
          echo "+ $cmd"
          bash -c "$cmd"
          report=""
          while IFS= read -r glob; do
            for f in $glob; do
              if [ -f "$f" ] && [ -s "$f" ]; then report="$f"; break 2; fi
            done
          done < <(PYTHONPATH="$TOOLING" /tmp/release/bin/python -m release.manifest --manifest "$MANIFEST" --outputs validation-docs)
          if [ -z "$report" ]; then
            echo "::error::The validation-docs target produced no non-empty report. No validation evidence, no Release."
            exit 1
          fi
          echo "VALIDATION_REPORT=$report" >> "$GITHUB_ENV"
          echo "Validation report: $report"

      - name: Collect assets and compute SHA256SUMS
        if: steps.gate.outputs.applicable == 'true'
        run: |
          mkdir -p "$STATE_DIR/assets"
          cp "$VALIDATION_REPORT" "$STATE_DIR/assets/"
          # Every image's SBOM is a release asset and is checksummed.
          PYTHONPATH="$TOOLING" /tmp/release/bin/python <<'PY'
          import json, os, shutil
          state = os.environ["STATE_DIR"]
          for img in json.load(open(os.path.join(state, "images.json"))):
              shutil.copy(img["sbom_src"], os.path.join(state, "assets", img["sbom"]))
          PY
          # The release manifest: the signed source of truth for what the agent
          # deploys (tag -> per-component digest) plus the commit / run-id
          # it records. Written here (data only — no signing key in the build job)
          # so it is covered by SHA256SUMS; the release job signs it.
          COMMIT="$GITHUB_SHA" RUN_ID="$GITHUB_RUN_ID" \
          PYTHONPATH="$TOOLING" /tmp/release/bin/python <<'PY'
          import json, os
          state = os.environ["STATE_DIR"]
          imgs = json.load(open(os.path.join(state, "images.json")))
          manifest = {
              "schema": "cctc-release-manifest/v1",
              "tag": os.environ["TAG"],
              "repo": os.environ["REPO"],
              "commit": os.environ["COMMIT"],
              "run_id": os.environ["RUN_ID"],
              "components": [
                  {"name": i["name"], "ref": i["ref"], "digest": i["digest"]}
                  for i in imgs
              ],
          }
          with open(os.path.join(state, "assets", "release-manifest.json"), "w") as f:
              json.dump(manifest, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          ( cd "$STATE_DIR/assets" && sha256sum ./* > SHA256SUMS )
          echo "Assets:"
          ls -1 "$STATE_DIR/assets"

      # Milestone-scoped notes + CtQ traceability matrix + the released-image
      # table. Issue bodies are fetched to a file and read as data — never
      # interpolated into source.
      - name: Generate release notes
        if: steps.gate.outputs.applicable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE: ${{ inputs.milestone }}
        run: |
          milestone="${MILESTONE:-$TAG}"
          number=$(gh api "repos/$REPO/milestones?state=all" \
            --jq ".[] | select(.title == \"$milestone\") | .number" | head -n1)
          if [ -n "$number" ]; then
            gh api "repos/$REPO/issues?milestone=$number&state=closed&per_page=100" --paginate \
              > "$STATE_DIR/issues.json"
          else
            echo "::warning::No milestone titled '$milestone' found — notes will have an empty changelog."
            echo "[]" > "$STATE_DIR/issues.json"
          fi
          prev_tag=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          MILESTONE="$milestone" PREV_TAG="$prev_tag" \
          PYTHONPATH="$TOOLING" /tmp/release/bin/python <<'PY'
          import json, os, yaml
          from release import notes
          from release.notes import MilestoneItem

          state = os.environ["STATE_DIR"]
          with open(os.path.join(state, "issues.json")) as f:
              raw = json.load(f)
          items = []
          for it in raw:
              if "pull_request" in it:  # the issues API returns PRs too
                  continue
              items.append(MilestoneItem(
                  number=it["number"],
                  title=it.get("title") or "",
                  body=it.get("body") or "",
                  labels=[l["name"] for l in it.get("labels") or []],
              ))

          class _Evidence:
              def milestone_items(self, repo, milestone):
                  return items

          # name -> full pinned ref, for the released-image table.
          released = {
              img["name"]: f"{img['ref']}@{img['digest']}"
              for img in json.load(open(os.path.join(state, "images.json")))
          }
          compliance = yaml.safe_load(open(os.environ["COMPLIANCE_PATH"])) or {}
          md = notes.build_notes(
              repo=os.environ["REPO"],
              milestone=os.environ["MILESTONE"],
              tag=os.environ["TAG"],
              prev_tag=os.environ.get("PREV_TAG") or "",
              compliance=compliance,
              evidence=_Evidence(),
              images=released,
          )
          with open(os.path.join(state, "notes.md"), "w") as f:
              f.write(md)
          PY
          echo "Notes generated."

      - name: Upload the release bundle
        if: steps.gate.outputs.applicable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: _release-state
          retention-days: 5
          include-hidden-files: true

      - name: Not a regulated repo
        if: steps.gate.outputs.applicable != 'true'
        run: echo "Release workflow not applicable to this repo (no .compliance.yml or regulatory_tier=none)."

  # ---------------------------------------------------------------------------
  # Cut the Release. There is no in-run approval gate: a gated active release
  # (`approvers_team` set) is cut as a DRAFT and a digest-bound authorisation
  # issue is opened in the caller repo; a separate issue_comment-triggered run
  # (release-authorize.yml) publishes the draft on `/approve`. The build run ends
  # here rather than blocking a runner waiting on a human (GitHub kills any job at
  # 6h and bills the wait). An evaluate release is also a draft; an active release
  # with no `approvers_team` publishes directly.
  # ---------------------------------------------------------------------------
  release:
    needs: build
    if: >-
      !cancelled()
      && needs.build.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: write
    env:
      TAG: ${{ inputs.tag }}
      ENFORCEMENT: ${{ inputs.enforcement }}
      APPROVERS_TEAM: ${{ inputs.approvers_team }}
      REPO: ${{ github.repository }}
      STATE_DIR: ${{ github.workspace }}/_release-state
    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: _release-state

      # The release job runs on a fresh runner; re-fetch the tooling so the
      # authorisation-issue step can render with scripts/release.
      - name: Checkout release tooling
        uses: actions/checkout@v6
        with:
          repository: CCTC-team/.github
          ref: ${{ inputs.tooling_ref }}
          path: _release-tooling

      # An active release with an `approvers_team` is GATED: cut as a draft and
      # held for a `/approve` on the authorisation issue. Computed once here so the
      # create-Release and open-issue steps agree on whether to gate.
      - name: Determine whether this release is gated
        id: gate
        run: |
          gated=false
          if [ "$ENFORCEMENT" = "active" ] && [ -n "$APPROVERS_TEAM" ]; then
            gated=true
          fi
          echo "gated=$gated" >> "$GITHUB_OUTPUT"
          echo "Gated active release: $gated"

      # Sign the release manifest with the org release-signing key (org secret
      # RELEASE_SIGNING_KEY). This job runs no repo build commands, so the private
      # key is never exposed to manifest-declared `run:` steps. The pull-agent
      # verifies this signature against its allowed_signers before trusting any
      # digest. No `if:` references the secret (the `secrets` context is not
      # available in `if:`); the empty-key case is handled in the script.
      - name: Sign the release manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.release_signing_key }}
        run: |
          manifest="$STATE_DIR/assets/release-manifest.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::release-manifest.json missing from the bundle — cannot sign."
            exit 1
          fi
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if [ "$ENFORCEMENT" = "active" ]; then
              echo "::error::No RELEASE_SIGNING_KEY org secret — cannot sign the manifest for an active release. See docs/release-signing-setup.md."
              exit 1
            fi
            echo "::warning::[evaluate] No RELEASE_SIGNING_KEY org secret — release manifest left UNSIGNED. An active release will fail and the agent will refuse an unsigned manifest. See docs/release-signing-setup.md."
            exit 0
          fi
          key="$(mktemp)"
          chmod 600 "$key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          # The namespace binds the signature to this use; the agent verifies with
          # the same `-n cctc-release`. ssh-keygen writes <manifest>.sig alongside.
          if ! ssh-keygen -Y sign -f "$key" -n cctc-release "$manifest"; then
            rm -f "$key"
            echo "::error::Failed to sign the release manifest (is RELEASE_SIGNING_KEY a valid OpenSSH private key?)."
            exit 1
          fi
          rm -f "$key"
          echo "Signed release manifest -> $(basename "$manifest").sig"
          ls -1 "$STATE_DIR/assets"

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GATED: ${{ steps.gate.outputs.gated }}
        run: |
          shopt -s nullglob
          assets=( "$STATE_DIR"/assets/* )
          args=( "$TAG" --title "$TAG" --notes-file "$STATE_DIR/notes.md" )
          # Draft in evaluate, OR when gated (a gated active release is held
          # unpublished until /approve flips it; the pull-agent ignores drafts).
          if [ "$ENFORCEMENT" != "active" ] || [ "$GATED" = "true" ]; then
            args+=( --draft )
          fi
          # Prerelease (no --latest) for -rc/-beta tags. --latest only when we
          # publish now: active AND not gated.
          case "$TAG" in
            *-rc*|*-beta*) args+=( --prerelease ) ;;
            *) [ "$ENFORCEMENT" = "active" ] && [ "$GATED" != "true" ] && args+=( --latest ) ;;
          esac
          gh release create "${args[@]}" "${assets[@]}"

      # Gated active release: open the digest-bound authorisation issue in the
      # caller repo. The release author is recorded here (github.actor); the
      # author≠approver check (Decision 5) compares a /approve commenter against
      # this value. release-authorize.yml publishes the draft on approval.
      - name: Open the authorisation issue
        if: steps.gate.outputs.gated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          TOOLING: ${{ github.workspace }}/_release-tooling/scripts
        run: |
          PYTHONPATH="$TOOLING" python3 <<'PY'
          import json, os
          from release import authorization

          state = os.environ["STATE_DIR"]
          manifest = json.load(open(os.path.join(state, "assets", "release-manifest.json")))
          images = json.load(open(os.path.join(state, "images.json")))
          record = authorization.IssueRecord(
              tag=manifest["tag"],
              repo=manifest["repo"],
              run_id=os.environ["RUN_ID"],
              run_url=os.environ["RUN_URL"],
              author=os.environ["ACTOR"],
              components=[
                  authorization.Component(name=i["name"], ref=i["ref"], digest=i["digest"])
                  for i in images
              ],
          )
          title, body = authorization.render_issue(record)
          with open(os.path.join(state, "issue-title.txt"), "w") as f:
              f.write(title)
          with open(os.path.join(state, "issue-body.md"), "w") as f:
              f.write(body)
          PY
          title="$(cat "$STATE_DIR/issue-title.txt")"
          gh issue create \
            --title "$title" \
            --body-file "$STATE_DIR/issue-body.md" \
            --label release-authorisation
          {
            echo "## Release authorisation"
            echo ""
            echo "Draft cut — awaiting \`/approve\` from a non-author member of @${REPO%/*}/${APPROVERS_TEAM} on the authorisation issue."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release manifest summary
        run: |
          {
            echo "## Release ${TAG}"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Enforcement | \`${ENFORCEMENT}\` (draft if evaluate) |"
            echo "| Checksums | \`SHA256SUMS\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          state = os.environ["STATE_DIR"]
          for img in json.load(open(os.path.join(state, "images.json"))):
              print(f"| Image `{img['name']}` | `{img['ref']}@{img['digest']}` (SBOM + signed manifest) |")
          PY
