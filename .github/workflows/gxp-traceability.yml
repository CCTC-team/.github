name: GxP traceability gate (reusable)

# Reusable workflow enforcing PR-level traceability on changes that touch
# the validated state. Regulated repos opt in by adding a caller at
# .github/workflows/gxp-traceability.yml that uses this file.
#
# What it checks (in order):
#   1. .compliance.yml exists and parses. If absent, this repo isn't
#      regulated — workflow exits success.
#   2. regulatory_tier != none. If "none", exits success.
#   3. Compute "in-scope changes" = PR's changed files matching
#      validated_paths minus exempt_paths. If validated_paths is absent
#      (it is optional), falls back to strict mode where
#      every changed file counts as in-scope.
#   4. If no in-scope changes: exits success (the PR touches no
#      validated artefacts).
#   5. Otherwise, the PR must close (via "Closes #N" / "Fixes #N") at
#      least one regulated issue, and each such issue must have
#      non-empty "Risk ID:" and "Requirement ID:" lines in its body.
#
# enforcement input:
#   "evaluate" (default) — failures emit ::warning:: and the workflow
#       exits 0. Suitable for rollout: violations are visible in PR
#       conversations and the Actions log, but don't block merges.
#   "active"  — failures emit ::error:: and the workflow exits 1.
#       Suitable once you've watched evaluate-mode output for a cycle.
#
# Caller example (.github/workflows/gxp-traceability.yml in a
# regulated repo):
#
#   name: GxP traceability
#   on:
#     pull_request:
#       branches: [main, develop]
#   jobs:
#     gate:
#       uses: CCTC-team/.github/.github/workflows/gxp-traceability.yml@main
#       with:
#         enforcement: evaluate

on:
  workflow_call:
    inputs:
      compliance_path:
        description: "Path to .compliance.yml in the caller repo."
        type: string
        default: ".compliance.yml"
      regulated_label:
        description: "Label that marks an issue as a regulated feature. Issues without this label are not gated."
        type: string
        default: "regulated"
      enforcement:
        description: "active | evaluate. evaluate logs warnings but does not fail the workflow."
        type: string
        default: "evaluate"

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Set up Python
        run: |
          python3 -m venv /tmp/gate
          /tmp/gate/bin/pip install --quiet --upgrade pip
          /tmp/gate/bin/pip install --quiet 'pyyaml>=6' 'pathspec>=0.12'

      - name: Resolve compliance state, changed files, and required linkage
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          COMPLIANCE_PATH: ${{ inputs.compliance_path }}
          REGULATED_LABEL: ${{ inputs.regulated_label }}
          ENFORCEMENT: ${{ inputs.enforcement }}
          STATE_DIR: /tmp/gate-state
        run: |
          set -e
          mkdir -p "$STATE_DIR"

          emit() {
            if [ "$ENFORCEMENT" = "active" ]; then
              echo "::error::$*"
            else
              echo "::warning::[evaluate-mode] $*"
            fi
          }

          # 1. .compliance.yml present?
          if [ ! -f "$COMPLIANCE_PATH" ]; then
            echo "No $COMPLIANCE_PATH at base ref — repo not regulated, exiting success."
            exit 0
          fi

          # 2. Parse compliance state to a JSON file. All Python heredocs use
          # quoted <<'PY' and read inputs via files referenced through env vars;
          # untrusted data (issue bodies, paths) never gets interpolated into
          # Python source.
          /tmp/gate/bin/python <<'PY'
          import os, yaml, json
          with open(os.environ["COMPLIANCE_PATH"]) as f:
              d = yaml.safe_load(f) or {}
          state = {
              # Transitional: read regulatory_tier, falling back to the legacy
              # system_category key so a repo whose .compliance.yml has not yet
              # been migrated still gates (rather than silently passing). Drop
              # the fallback once all consuming manifests are on regulatory_tier.
              "regulatory_tier": d.get("regulatory_tier") or d.get("system_category"),
              "validated_paths": d.get("validated_paths"),
              "exempt_paths": d.get("exempt_paths") or [],
          }
          with open(os.path.join(os.environ["STATE_DIR"], "compliance.json"), "w") as f:
              json.dump(state, f)
          PY

          regulatory_tier=$(/tmp/gate/bin/python <<'PY'
          import json, os
          with open(os.path.join(os.environ["STATE_DIR"], "compliance.json")) as f:
              print(json.load(f)["regulatory_tier"] or "")
          PY
          )
          if [ "$regulatory_tier" = "none" ] || [ -z "$regulatory_tier" ]; then
            echo "regulatory_tier=$regulatory_tier — gate not applicable, exiting success."
            exit 0
          fi

          # 3. Compute in-scope changes. The checkout above pinned us to
          # base.sha; HEAD_SHA may not be in the local object store yet, so
          # fetch it explicitly. A failed fetch must be a hard error — if
          # it were swallowed, `git diff` against a missing object would
          # also fail under `set -e`, but surfacing the fetch failure
          # directly makes the cause obvious instead of pointing at diff.
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$STATE_DIR/changed.txt"
          if [ ! -s "$STATE_DIR/changed.txt" ]; then
            echo "No file changes in PR — exiting success."
            exit 0
          fi

          /tmp/gate/bin/python <<'PY'
          import json, os
          from pathspec import PathSpec
          state_dir = os.environ["STATE_DIR"]
          with open(os.path.join(state_dir, "compliance.json")) as f:
              state = json.load(f)
          with open(os.path.join(state_dir, "changed.txt")) as f:
              changed = [l.rstrip("\n") for l in f if l.strip()]
          validated = state.get("validated_paths")
          exempt = state.get("exempt_paths") or []
          if validated is None:
              # strict mode — every change is in-scope
              in_scope = list(changed)
          else:
              vspec = PathSpec.from_lines("gitwildmatch", validated)
              espec = PathSpec.from_lines("gitwildmatch", exempt) if exempt else None
              in_scope = [p for p in changed if vspec.match_file(p) and not (espec and espec.match_file(p))]
          with open(os.path.join(state_dir, "in_scope.txt"), "w") as f:
              f.write("\n".join(in_scope))
          PY

          if [ ! -s "$STATE_DIR/in_scope.txt" ]; then
            echo "PR touches no validated paths — exiting success."
            {
              echo "## Traceability gate"
              echo ""
              echo "PR touches no validated paths. Gate not applicable."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "In-scope changes:"
          sed 's/^/  - /' "$STATE_DIR/in_scope.txt"

          # 4. Resolve linked closing issues via GraphQL. Response is written
          # directly to a file — never reinterpolated into shell or Python source.
          gh api graphql -F number="$PR_NUMBER" -F owner="${REPO%/*}" -F name="${REPO#*/}" -f query='
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                closingIssuesReferences(first: 20) {
                  nodes { number title body labels(first: 20) { nodes { name } } }
                }
              }
            }
          }' > "$STATE_DIR/linked.json"

          issue_count=$(/tmp/gate/bin/python <<'PY'
          import json, os
          with open(os.path.join(os.environ["STATE_DIR"], "linked.json")) as f:
              d = json.load(f)
          print(len(d["data"]["repository"]["pullRequest"]["closingIssuesReferences"]["nodes"]))
          PY
          )

          status=0

          if [ "$issue_count" = "0" ]; then
            emit "PR closes no issues. A PR touching validated paths must include 'Closes #N' for at least one regulated issue with Risk ID and Requirement ID set."
            status=1
          fi

          # 5. For each linked issue, extract Risk ID and Requirement ID into checks.json.
          /tmp/gate/bin/python <<'PY'
          import json, os, re
          state_dir = os.environ["STATE_DIR"]
          with open(os.path.join(state_dir, "linked.json")) as f:
              data = json.load(f)
          nodes = data["data"]["repository"]["pullRequest"]["closingIssuesReferences"]["nodes"]
          regulated_label = os.environ["REGULATED_LABEL"]
          out = []
          for n in nodes:
              labels = {l["name"] for l in n["labels"]["nodes"]}
              regulated = regulated_label in labels
              body = n["body"] or ""
              risk = re.search(r"(?im)^[#\s>*-]*risk\s*id\s*:\s*(.+)$", body)
              req  = re.search(r"(?im)^[#\s>*-]*requirement\s*id\s*:\s*(.+)$", body)
              out.append({
                  "number": n["number"],
                  "title": n["title"],
                  "regulated": regulated,
                  "risk_id": (risk.group(1).strip() if risk else ""),
                  "req_id":  (req.group(1).strip()  if req  else ""),
              })
          with open(os.path.join(state_dir, "checks.json"), "w") as f:
              json.dump(out, f)
          PY

          /tmp/gate/bin/python <<'PY'
          import json, os
          with open(os.path.join(os.environ["STATE_DIR"], "checks.json")) as f:
              checks = json.load(f)
          lines = ["## Traceability gate", "", f"Enforcement: `{os.environ['ENFORCEMENT']}`", "", "| Issue | Regulated | Risk ID | Requirement ID |", "|---|---|---|---|"]
          for c in checks:
              lines.append(f"| #{c['number']} {c['title']} | {'yes' if c['regulated'] else 'no'} | {c['risk_id'] or '_missing_'} | {c['req_id'] or '_missing_'} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

          any_regulated=$(/tmp/gate/bin/python <<'PY'
          import json, os
          with open(os.path.join(os.environ["STATE_DIR"], "checks.json")) as f:
              checks = json.load(f)
          print("1" if any(c["regulated"] for c in checks) else "0")
          PY
          )

          if [ "$issue_count" != "0" ] && [ "$any_regulated" = "0" ]; then
            emit "PR closes issues but none carry the '$REGULATED_LABEL' label. Regulated changes must link to a regulated-labelled issue."
            status=1
          fi

          # Use a NUL-delimited stream so field lists like "Risk ID,Requirement ID"
          # (which contain spaces) survive word-splitting.
          while IFS= read -r -d '' missing; do
            num="${missing%%:*}"
            fields="${missing#*:}"
            emit "Linked regulated issue #$num is missing $fields. Set these in the issue body using the regulated feature template."
            status=1
          done < <(/tmp/gate/bin/python <<'PY'
          import json, os, sys
          with open(os.path.join(os.environ["STATE_DIR"], "checks.json")) as f:
              checks = json.load(f)
          for c in checks:
              if c["regulated"] and (not c["risk_id"] or not c["req_id"]):
                  miss = []
                  if not c["risk_id"]: miss.append("Risk ID")
                  if not c["req_id"]:  miss.append("Requirement ID")
                  sys.stdout.write(f"{c['number']}:{','.join(miss)}\0")
          PY
          )

          if [ "$ENFORCEMENT" = "active" ] && [ "$status" != "0" ]; then
            exit 1
          fi
          if [ "$ENFORCEMENT" != "active" ] && [ "$status" != "0" ]; then
            echo "Gate would have failed in active mode — emitting warnings, exiting 0 (evaluate)."
          fi
          exit 0
