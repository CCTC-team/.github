name: Release authorisation (reusable)

# Reusable workflow that PUBLISHES a draft release when a member of the
# QA-approver team who is NOT the release author comments `/approve` on the
# authorisation issue cut by release.yml — the Team-compatible equivalent of an
# Enterprise `production` Environment approval. `/deny` closes the issue and
# leaves the release a draft. The pull-agent deploys only PUBLISHED releases, so
# "publish-on-approve" is the whole gate; no agent change is needed.
#
# Regulated repos opt in with a caller at .github/workflows/release-authorize.yml
# (see templates/compliance/release-authorize-caller.yml) that runs on
# `issue_comment` and forwards the triggering issue/comment IDs and the
# org-read token.
#
# Security posture mirrors gxp-traceability.yml and release.yml:
#   * The caller forwards only NUMERIC ids (issue number, comment id); the issue
#     and comment are RE-FETCHED here, server-side, so a forged input cannot
#     redirect the gate. Untrusted text (issue/comment bodies) is written to
#     files and read by Python as data — never interpolated into a shell or into
#     Python source.
#   * The publishable target (repo, tag, digests) is parsed from the
#     workflow-authored issue body, not the comment — a comment only signals
#     approve/deny (Decision: target from the issue record).
#   * Team membership is verified server-side with an org-read token, never
#     trusted from the comment; the default GITHUB_TOKEN cannot read org teams.
#   * Author != approver is enforced from the author recorded in the issue.

on:
  workflow_call:
    inputs:
      issue_number:
        description: "Number of the authorisation issue the comment was posted on (github.event.issue.number)."
        type: string
        required: true
      comment_id:
        description: "ID of the triggering comment (github.event.comment.id)."
        type: string
        required: true
      approvers_team:
        description: "Org team slug whose members may authorise (default qa-approvers)."
        type: string
        default: "qa-approvers"
      org:
        description: "Org that owns the approvers team."
        type: string
        default: "CCTC-team"
      authorisation_label:
        description: "Label marking an issue as a release-authorisation control issue."
        type: string
        default: "release-authorisation"
      tooling_ref:
        description: "Ref of CCTC-team/.github to load scripts/release from."
        type: string
        default: "main"
    secrets:
      org_read_token:
        description: "Token with org Members:read (read:org) to verify approvers-team membership. The default GITHUB_TOKEN cannot. See docs/release-authorisation-token-setup.md."
        required: true

jobs:
  authorise:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish / edit the release
      issues: write     # comment on and close the authorisation issue
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      COMMENT_ID: ${{ inputs.comment_id }}
      ORG: ${{ inputs.org }}
      APPROVERS_TEAM: ${{ inputs.approvers_team }}
      AUTH_LABEL: ${{ inputs.authorisation_label }}
      STATE_DIR: ${{ github.workspace }}/_authz-state
      TOOLING: ${{ github.workspace }}/_release-tooling/scripts
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v6
        with:
          repository: CCTC-team/.github
          ref: ${{ inputs.tooling_ref }}
          path: _release-tooling

      # Re-fetch the issue and the comment server-side. The caller passed only
      # numeric ids; validate they ARE numeric before using them in an API path,
      # then write the API responses straight to files (never re-interpolated).
      - name: Fetch the issue and comment
        run: |
          set -e
          mkdir -p "$STATE_DIR"
          if ! printf '%s' "$ISSUE_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "::error::issue_number is not numeric — refusing."
            exit 1
          fi
          if ! printf '%s' "$COMMENT_ID" | grep -qE '^[0-9]+$'; then
            echo "::error::comment_id is not numeric — refusing."
            exit 1
          fi
          gh api "repos/$REPO/issues/$ISSUE_NUMBER" > "$STATE_DIR/issue.json"
          gh api "repos/$REPO/issues/comments/$COMMENT_ID" > "$STATE_DIR/comment.json"

      # The commenter login drives the team-membership lookup. Extract it from the
      # fetched comment (as data) and validate it is a well-formed GitHub login
      # before it ever reaches an API path or $GITHUB_ENV.
      - name: Resolve the commenter
        id: commenter
        run: |
          login=$(python3 <<'PY'
          import json, os, re
          c = json.load(open(os.path.join(os.environ["STATE_DIR"], "comment.json")))
          login = ((c.get("user") or {}).get("login") or "")
          print(login if re.fullmatch(r"[A-Za-z0-9-]+", login) else "")
          PY
          )
          echo "login=$login" >> "$GITHUB_OUTPUT"
          if [ -z "$login" ]; then
            echo "::warning::Comment has no well-formed author login; treating as non-authoriser."
          fi

      # Verify team membership server-side with the org-read token (the default
      # GITHUB_TOKEN cannot read org teams). Only an ACTIVE membership counts; a
      # pending invite does not. A non-member returns 404 -> member=false.
      - name: Verify approvers-team membership
        id: membership
        env:
          ORG_READ_TOKEN: ${{ secrets.org_read_token }}
          COMMENTER: ${{ steps.commenter.outputs.login }}
        run: |
          member=false
          if [ -n "$COMMENTER" ]; then
            state=$(GH_TOKEN="$ORG_READ_TOKEN" gh api \
              "orgs/$ORG/teams/$APPROVERS_TEAM/memberships/$COMMENTER" \
              --jq '.state' 2>/dev/null || true)
            [ "$state" = "active" ] && member=true
          fi
          echo "member=$member" >> "$GITHUB_OUTPUT"
          echo "Verified team member: $member"

      # Pure decision: parse the publishable target from the issue body, and run
      # authorization.decide over the comment + the VERIFIED membership boolean.
      # Emits the action, the target tag, and (on approve) the filled
      # authorisation block to stamp into the notes.
      - name: Decide
        id: decide
        env:
          TEAM_MEMBER: ${{ steps.membership.outputs.member }}
          COMMENTER: ${{ steps.commenter.outputs.login }}
        run: |
          PYTHONPATH="$TOOLING" python3 <<'PY'
          import json, os, re

          from release import authorization

          state = os.environ["STATE_DIR"]
          issue = json.load(open(os.path.join(state, "issue.json")))
          comment = json.load(open(os.path.join(state, "comment.json")))

          labels = {l.get("name") for l in (issue.get("labels") or [])}
          has_label = os.environ["AUTH_LABEL"] in labels
          issue_open = issue.get("state") == "open"
          record = authorization.parse_issue(issue.get("body") or "")

          decision = authorization.decide(
              comment_body=comment.get("body") or "",
              commenter=os.environ["COMMENTER"],
              author=(record.author if record else ""),
              is_team_member=os.environ["TEAM_MEMBER"] == "true",
              issue_is_authorisation=has_label and record is not None,
              already_resolved=not issue_open,
          )

          tag = record.tag if record else ""
          prerelease = bool(re.search(r"-(rc|beta)", tag))
          # Nudge only when an open authorisation issue gets a /approve that did
          # nothing because the commenter lacks authority — the helpful case.
          first_token = ((comment.get("body") or "").strip().split() or [""])[0].lower()
          nudge = (
              decision.action == "ignore"
              and first_token == "/approve"
              and issue_open
              and has_label
              and record is not None
              and os.environ["TEAM_MEMBER"] != "true"
          )
          out = {
              "action": decision.action,
              "reason": decision.reason,
              "tag": tag,
              "latest": "true" if (decision.action == "approve" and tag and not prerelease) else "false",
              "nudge": "true" if nudge else "false",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in out.items():
                  f.write(f"{k}={v}\n")

          # On approval, pre-render the authorisation block (approver, UTC from
          # the comment, digests from the record) for the Act step to stamp in.
          if decision.action == "approve" and record:
              digests = "; ".join(
                  f"{c.name} {c.ref}@{c.digest}" for c in record.components
              )
              block = (
                  "## Release authorisation\n\n"
                  f"- **Approved by:** @{os.environ['COMMENTER']}\n"
                  f"- **Approved at (UTC):** {comment.get('created_at', '')}\n"
                  f"- **Released image digests:** {digests}\n\n"
                  "The formal electronic signature of record (re-authentication + "
                  "explicit meaning + signer role) is captured in the application "
                  "signature flow or the CTU QMS/eTMF, referencing the digests "
                  "above — see docs/release-authorisation.md.\n"
              )
              with open(os.path.join(state, "auth-block.md"), "w") as f:
                  f.write(block)
          # The reason is written to a file so the Act step posts it verbatim
          # without interpolating it through the shell.
          with open(os.path.join(state, "reason.md"), "w") as f:
              f.write(decision.reason + "\n")
          PY

      # Act on the verdict. approve -> publish the draft, stamp the authorisation
      # block into the notes, comment the outcome, close the issue. deny -> comment
      # and close (left a draft). ignore -> a one-line nudge only for a
      # non-authoriser /approve; otherwise nothing. Idempotent: a resolved (closed)
      # issue decides to `ignore`, so re-running on it is a no-op.
      # approve -> publish the draft, stamp the authorisation block into the
      # notes, comment the outcome, close the issue. Each action is its own step
      # (gated on the decision) rather than a `case` in one script, so every
      # Python heredoc sits at the base indentation and terminates cleanly.
      - name: Publish the release (approve)
        if: steps.decide.outputs.action == 'approve'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          LATEST: ${{ steps.decide.outputs.latest }}
        run: |
          set -e
          # Publish the draft; --latest only for a non-prerelease tag.
          edit=( "$TAG" --draft=false )
          [ "$LATEST" = "true" ] && edit+=( --latest )
          gh release edit "${edit[@]}"
          # Stamp the authorisation block into the notes, replacing the pending
          # placeholder (the final section of the generated notes). If the marker
          # is absent (notes edited by hand), append rather than silently doubling.
          gh release view "$TAG" --json body --jq '.body' > "$STATE_DIR/release-body.md"
          python3 <<'PY'
          import os
          state = os.environ["STATE_DIR"]
          body = open(os.path.join(state, "release-body.md")).read()
          block = open(os.path.join(state, "auth-block.md")).read()
          marker = "## Release authorisation"
          head = body.split(marker)[0] if marker in body else body.rstrip() + "\n\n"
          open(os.path.join(state, "notes.md"), "w").write(head + block)
          PY
          gh release edit "$TAG" --notes-file "$STATE_DIR/notes.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$STATE_DIR/reason.md"
          gh issue comment "$ISSUE_NUMBER" --body "Release **$TAG** published. ✅"
          gh issue close "$ISSUE_NUMBER" --reason completed

      # deny -> comment the reason and close; the release stays a draft.
      - name: Close the authorisation (deny)
        if: steps.decide.outputs.action == 'deny'
        run: |
          set -e
          gh issue comment "$ISSUE_NUMBER" --body-file "$STATE_DIR/reason.md"
          gh issue close "$ISSUE_NUMBER" --reason "not planned"

      # ignore -> no state change. A /approve from a non-authoriser gets a single
      # nudge so they know why nothing happened; anything else is silent.
      - name: Nudge a non-authoriser (ignore)
        if: steps.decide.outputs.action == 'ignore' && steps.decide.outputs.nudge == 'true'
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$STATE_DIR/reason.md"
