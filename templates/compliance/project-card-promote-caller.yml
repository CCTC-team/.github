name: Project card promote

# Forward-only auto-promotion of this repo's regulated lifecycle cards.
# Reads `vars.LIFECYCLE_PROJECT_NUMBER` — the repo variable that maps
# this repo to the regulated lifecycle board it lives on. If unset,
# the reusable workflow no-ops via its guard step.
#
# Set the variable once (Settings → Secrets and variables → Actions →
# Variables) to the project number that hosts this repo's cards. See
# CCTC-team/.github → README.md "Per-repo opt-in" for the list of files
# every regulated repo carries.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  check_suite:
    types: [completed]

jobs:
  promote:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: CCTC-team/.github/.github/workflows/project-card-promote.yml@main
    with:
      project_owner: CCTC-team
      project_number: ${{ vars.LIFECYCLE_PROJECT_NUMBER }}
    secrets:
      # Required for cross-repo project writes — the default GITHUB_TOKEN
      # has no org-level write:project scope. The two org secrets are
      # provisioned per `docs/project-enforcement-app-setup.md` (Option A
      # or Option B). If both are unset the workflow falls back to
      # github.token and the mutation step will fail loudly.
      app_client_id:  ${{ secrets.ORG_PROJECT_ENFORCEMENT_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.ORG_PROJECT_ENFORCEMENT_APP_PRIVATE_KEY }}
