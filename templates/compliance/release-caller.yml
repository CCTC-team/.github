# Release pipeline for this regulated repo.
#
# Ships as `.github/workflows/release.yml` (pushed by the compliance-drift
# workflow). A push of a `v*` tag triggers the org's reusable release workflow,
# which builds the container image, pushes it to GHCR by digest, generates an
# SBOM and signs a release manifest, and cuts a Release with the validation evidence.
#
# All repo-specific binding (build commands, image ref, report/SBOM paths) lives
# in `.github/release-targets.yml` — there is deliberately nothing repo-specific
# here.
#
# Rollout: start in `enforcement: evaluate` (cuts a DRAFT Release with the full
# artifact set; the pull-agent ignores drafts, so nothing auto-deploys). Once
# you have watched a clean draft-Release cycle, flip to `enforcement: active`
# (publishes a Release and fails on critical/high vulnerabilities). To gate
# production publication on QA reviewers, also set `approvers_team: qa-approvers`:
# an active release is then cut as a DRAFT with a digest-bound authorisation
# issue, and a `qa-approvers` member who is NOT the release author publishes it by
# commenting `/approve` on that issue (see docs/release-authorisation.md). This
# needs the companion `.github/workflows/release-authorize.yml` caller and the
# `QA_ORG_READ_TOKEN` secret (see docs/release-authorisation-token-setup.md).

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
      packages: write
      # `issues: write` — the reusable workflow opens the digest-bound
      # authorisation issue for a gated active release (and reads milestone
      # issues for the notes).
      issues: write
      pull-requests: read
      # The caller's permissions are the envelope for the reusable workflow: any
      # scope omitted here is `none` for every called job, and a called job that
      # requests more fails the run at startup. `actions: read` is required for the
      # release job to download this run's build artifact bundle.
      actions: read
    uses: CCTC-team/.github/.github/workflows/release.yml@main
    with:
      tag: ${{ github.ref_name }}
      enforcement: evaluate
      # approvers_team: qa-approvers   # uncomment to gate active publication on a
      #   /approve from a non-author qa-approvers member (needs the
      #   release-authorize.yml caller + QA_ORG_READ_TOKEN secret)
    secrets:
      # Org-level secret holding the release-signing private key; the reusable
      # workflow signs the release manifest with it. See docs/release-signing-setup.md.
      release_signing_key: ${{ secrets.RELEASE_SIGNING_KEY }}
