# Release-authorisation caller for this regulated repo.
#
# Ships as `.github/workflows/release-authorize.yml` (pushed by the
# compliance-drift workflow). It listens for comments on the digest-bound
# authorisation issue that the release workflow opens for a gated active release,
# and forwards them to the org's reusable authorisation workflow, which publishes
# the draft release when a `qa-approvers` member who is NOT the release author
# comments `/approve` (or closes it on `/deny`).
#
# This is the companion to the release caller's `approvers_team: qa-approvers`.
# It needs the `QA_ORG_READ_TOKEN` secret — a token with org Members:read that
# can verify team membership server-side (the default GITHUB_TOKEN cannot). See
# docs/release-authorisation-token-setup.md.

name: Release authorisation

on:
  issue_comment:
    types: [created]

jobs:
  authorise:
    # Cheap pre-filter so a run is only spent on a comment that could matter: an
    # open issue (not a PR), carrying the release-authorisation label. The
    # reusable workflow re-fetches everything server-side and makes the real
    # decision (command, membership, author != approver).
    if: >-
      !github.event.issue.pull_request
      && github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'release-authorisation')
    permissions:
      contents: write   # publish / edit the release
      issues: write     # comment on and close the authorisation issue
    uses: CCTC-team/.github/.github/workflows/release-authorize.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      comment_id: ${{ github.event.comment.id }}
      approvers_team: qa-approvers
    secrets:
      # Token with org Members:read (read:org); the reusable workflow verifies
      # qa-approvers membership with it. See docs/release-authorisation-token-setup.md.
      org_read_token: ${{ secrets.QA_ORG_READ_TOKEN }}
