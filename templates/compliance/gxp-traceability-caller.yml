name: GxP traceability

on:
  pull_request:
    branches: [main, develop]

jobs:
  gate:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: CCTC-team/.github/.github/workflows/gxp-traceability.yml@main
    with:
      # evaluate → log violations as warnings without blocking merges.
      # Flip to "active" once you've watched a cycle of real PRs and
      # are confident validated_paths in this repo's .compliance.yml
      # is set correctly.
      enforcement: evaluate
